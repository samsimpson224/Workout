<title>Training &amp; Weather Hub</title>
<style>
:root{--bg:#0f1015;--card:#181a22;--acc:#d4af37;--acc-glow:rgba(212,175,55,0.28);--tx:#f2f4f8;--mu:#9aa0b4;--bd:#2a2e3d}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 0%,#1b1e2b 0%,var(--bg) 70%);background-attachment:fixed;color:var(--tx);margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));max-width:600px;color-scheme:dark}
h1,h2{color:var(--acc);text-align:center;font-size:1.35rem;margin:8px 0;letter-spacing:.3px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.card{background:linear-gradient(165deg,#1e212b 0%,#15171f 100%);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);transition:border-color .3s,box-shadow .3s}
.card.tamed-card{border-color:var(--acc);box-shadow:0 8px 28px rgba(212,175,55,.22),inset 0 1px 0 rgba(255,215,0,.15)}
label{display:block;margin:8px 0 4px;font-weight:600;color:var(--acc);font-size:.92rem}
select,input,textarea{width:100%;padding:12px;background:#232734;border:1px solid var(--bd);color:#fff;border-radius:9px;font-size:16px !important;margin-bottom:8px;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
textarea{min-height:90px}
button{background:linear-gradient(180deg,#e0bd42 0%,#c49d27 100%);color:#121212;border:0;padding:12px;font-weight:700;border-radius:9px;width:100%;font-size:1rem;margin-top:8px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform .1s,opacity .15s,box-shadow .2s}
button:active{transform:translateY(1px);opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.alt{background:#262a38;color:var(--acc);border:1px solid #363b4e;box-shadow:none}
button.danger{background:#3a1d22;color:#ff7b7b;border:1px solid #5c2831;margin-top:10px}
.tabs{display:flex;gap:6px;margin:12px 0;background:#161820;padding:5px;border-radius:12px;border:1px solid var(--bd)}
.tabs button{margin:0;background:transparent;color:var(--mu);font-size:.85rem;padding:9px 2px;border-radius:8px;box-shadow:none}
.tabs button.on{background:linear-gradient(180deg,#e0bd42 0%,#c49d27 100%);color:#121212;box-shadow:0 2px 8px var(--acc-glow)}
.timer-bar{display:flex;gap:5px;align-items:center;overflow-x:auto;white-space:nowrap;margin-bottom:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.timer-bar::-webkit-scrollbar{display:none}
.timer-bar button{margin:0;padding:6px 10px;font-size:.78rem;flex-shrink:0;width:auto;background:#1e212b;color:var(--acc);border:1px solid var(--bd);box-shadow:none}
@keyframes pulseAlert{0%,100%{background:#252525;color:var(--acc);transform:scale(1)}50%{background:var(--acc);color:#121212;transform:scale(1.04)}}
.timer-done{animation:pulseAlert .7s infinite ease-in-out;border:2px solid var(--acc) !important}
#alarm{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000;font-size:3.2rem;font-weight:900;text-align:center;animation:flash .3s infinite alternate}
#alarm[hidden]{display:none}
#alarm small{font-size:1.1rem;font-weight:700;margin-top:12px}
@keyframes flash{from{background:#ff1a1a}to{background:#ffee00}}
code{word-break:break-all;background:#12141c;padding:2px 5px;border-radius:4px;color:#ffd700}
.poke{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#d4af37,#f3d058);color:#121212;padding:10px;border-radius:10px;margin-bottom:8px;font-weight:bold;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.poke[hidden]{display:none}.poke button{background:#121212;color:var(--acc)}
.bw-warn{background:#282112;border:1px solid #b89328;color:#fce38a;padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:.85rem;line-height:1.4}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:#212532;border:1px solid #2e3346;border-radius:10px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:1.45rem;color:var(--acc)}.stat small{color:var(--mu)}
.dg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px}
.dd{width:18px;height:18px;border-radius:4px;background:#232734}.dd.on{background:var(--acc);box-shadow:0 0 6px var(--acc-glow)}.dd.td{outline:2px solid #fff}
.bar{fill:var(--acc)}.ax{stroke:#444}.tx{fill:#aaa;font-size:9px}
.sub{display:flex;gap:6px;margin:8px 0;background:#14161f;padding:4px;border-radius:10px;border:1px solid var(--bd)}.sub button{margin:0;background:transparent;color:var(--mu);padding:9px;box-shadow:none}.sub button.on{background:var(--acc);color:#121212}
.box{background:#212532;border-left:4px solid var(--acc);padding:12px;border-radius:0 8px 8px 0;font-size:.95rem;line-height:1.4}
.info-panel{background:#151720;border:1px solid var(--bd);border-left:3px solid var(--acc);padding:12px;border-radius:9px;margin:8px 0;font-size:.85rem;line-height:1.45;color:#ddd}
.info-panel b{color:var(--acc)}
.info-panel ul,.info-panel ol{margin:6px 0;padding-left:18px}
.info-panel li{margin-bottom:6px}
.badge{display:inline-block;padding:4px 10px;font-size:.76rem;font-weight:600;background:#262a38;border:1px solid #3a4056;border-radius:99px;color:var(--acc);margin-bottom:8px}
.ex{background:#212532;border:1px solid #2d3244;padding:12px;border-radius:10px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.info b{display:block;font-size:.98rem}.info small{color:var(--mu);display:block;margin-top:2px}
.norm-tag{color:var(--acc);font-size:.75rem;margin-top:4px;opacity:.95}
.btn-grp{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap}
.mini{width:auto;margin:0;padding:6px 10px;font-size:.78rem;background:#2d3244;color:var(--acc);border:1px solid #3d445c;box-shadow:none}
.mini.hype{background:#3a2e11;color:#ffd700;border:1px solid #d4af37}
.inp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.inp input{margin:0;padding:9px;text-align:center;font-weight:600}
.set-pills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.set-pill{padding:4px 8px;font-size:.75rem;font-weight:700;background:#161822;border:1px solid var(--bd);border-radius:6px;color:var(--mu);cursor:pointer;transition:all .15s}
.set-pill.done{background:var(--acc);color:#121212;border-color:var(--acc);box-shadow:0 0 6px var(--acc-glow)}
.guide{margin-top:8px;font-size:.88rem;line-height:1.45;background:#161822;padding:10px;border-radius:8px;border:1px solid #2a2e3d}
.lnk{display:inline-block;margin:6px 8px 0 0;padding:6px 10px;background:#262a38;color:var(--acc);border-radius:6px;text-decoration:none;font-weight:bold;font-size:.8rem;border:1px solid #3a4056}
.msg{text-align:center;font-size:.85rem;margin-top:8px;min-height:1em}
.res{font-size:1.1rem;text-align:center;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0;font-size:.9rem;gap:8px}
.hint{color:var(--mu);font-size:.8rem;margin:6px 0;line-height:1.35}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.up{color:#4caf50;font-weight:bold}
.dn{color:#ff6b6b;font-weight:bold}
.s-pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:.72rem;font-weight:bold;margin-left:4px;background:#2a2415;color:#ffd700;border:1px solid #7a621d;transition:box-shadow .3s,background .3s}
@keyframes badgeGlow{0%,100%{box-shadow:0 0 6px rgba(255,215,0,.35)}50%{box-shadow:0 0 14px rgba(255,215,0,.7
